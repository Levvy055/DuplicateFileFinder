name: Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DuplicateFileFinder.sln

      - name: Build solution
        run: dotnet build DuplicateFileFinder.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DuplicateFileFinder.sln --no-build --configuration Release --verbosity normal
